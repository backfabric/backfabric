[package]
name = "backfabric"
description = "The fabric behind the interface: a network of agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
a2a-client-lf = { version = "0.2.9", default-features = false }
a2a-grpc = { version = "0.3.11", default-features = false }
a2a-lf = "0.4.2"
a2a-pb = "0.3.2"
a2a-server-lf = { version = "0.5.3", default-features = false }
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
futures = "0.3.34"
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-tickets = "1"
lru = "0.19.0"
secretspec = { version = "0.21.1", default-features = false, features = ["keyring"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-util", "signal"] }
toml = "1.1.8"
tonic = { version = "0.14", default-features = false, features = ["server", "channel"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
