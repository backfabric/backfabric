[project]
name = "backfabric"
revision = "1.0"
# The node key is read by the node itself at startup, not by an interactive
# user, so there is nobody to give a reason.
require_reason = false

[profiles.default]
BACKFABRIC_NODE_KEY = { description = "Ed25519 secret key of this node: 32 bytes as 64 hex characters, e.g. from `openssl rand -hex 32`", required = true }
